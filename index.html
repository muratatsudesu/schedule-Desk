<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q.T.S-SCHEDULE</title>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", Meiryo, sans-serif;
    }

    :root {
      --brown-dark: #543c29;
      --brown: #7a5c43;
      --brown-light: #f2ece4;
      --border: #e5dfd5;
      --paper: #ffffff;
      --background: #f6f4f0;
      --text: #3e3332;
    }

    body {
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px;
      background: var(--background);
      color: var(--text);
      letter-spacing: 0.02em;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header-banner {
      margin-bottom: 16px;
      padding: 16px 12px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, var(--brown) 0%, var(--brown-dark) 100%);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(84, 60, 41, 0.15);
    }

    .header-banner h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.15em;
    }

    .card {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(62, 51, 50, 0.04);
    }

    .card-title {
      margin: 0 0 12px;
      color: var(--brown-dark);
      font-size: 1rem;
    }

    .status-message {
      display: none;
      margin-bottom: 12px;
      padding: 10px;
      font-size: 0.85rem;
      border-radius: 6px;
    }

    .status-message.error {
      display: block;
      color: #8a1f1f;
      background: #fdeaea;
      border: 1px solid #efb4b4;
    }

    .status-message.success {
      display: block;
      color: #225d31;
      background: #eaf7ed;
      border: 1px solid #b5dfbd;
    }

    .top-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      padding-left: 34px;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      bottom: 10px;
      color: #7d7067;
      pointer-events: none;
    }

    .toolbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row > div {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--brown-dark);
      font-size: 0.82rem;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 9px 10px;
      color: var(--text);
      background: #faf8f5;
      border: 1px solid #dcd5c9;
      border-radius: 6px;
    }

    textarea {
      resize: vertical;
    }

    input:disabled {
      color: #999;
      background: #eee;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      background: #fff;
      border-color: var(--brown);
      box-shadow: 0 0 0 2px rgba(122, 92, 67, 0.12);
    }

    input[type="color"] {
      min-height: 42px;
      padding: 4px;
      cursor: pointer;
    }

    .all-day-box {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: var(--brown-dark);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .all-day-box input {
      width: auto;
      margin: 0;
    }

    .btn-box,
    .inline-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-primary,
    .btn-secondary,
    .btn-danger,
    .btn-small {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--brown) 0%, var(--brown-dark) 100%);
    }

    .btn-secondary {
      color: var(--brown-dark);
      background: var(--brown-light);
      border: 1px solid #dcd5c9;
    }

    .btn-danger {
      color: #fff;
      background: #c33;
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .today-list {
      display: grid;
      gap: 8px;
    }

    .today-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: #faf8f5;
      border: 1px solid var(--border);
      border-left: 6px solid #888;
      border-radius: 8px;
      cursor: pointer;
    }

    .today-time {
      min-width: 65px;
      color: #62564f;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .today-title {
      min-width: 0;
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .calendar-header h2 {
      margin: 0;
      color: var(--brown-dark);
      font-size: 1.1rem;
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      overflow: visible;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .day-header {
      padding: 6px 0;
      color: #7a6b5d;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      background: #faf8f5;
    }

    .sunday {
      color: #d23b32 !important;
    }

    .saturday {
      color: #3366bb !important;
    }

    .day-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 72px;
      overflow: visible;
      cursor: pointer;
      background: #fff;
    }

    .day-cell:hover {
      background: #faf5ee;
    }

    .day-cell.selected {
      background: #fdf0e5;
      box-shadow: inset 0 0 0 2px #b88962;
    }

    .day-cell.empty {
      cursor: default;
      background: #f7f5f0;
    }

    .day-number {
      padding: 3px 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .day-cell.today .day-number {
      color: #0055ff;
      font-weight: bold;
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }

    .events-container {
      display: flex;
      flex-grow: 1;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      padding-bottom: 2px;
    }

    .event-bar-wrapper {
      position: relative;
      width: 100%;
      height: 20px;
    }

    .event-bar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
      height: 20px;
      padding: 0 4px;
      overflow: hidden;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 600;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .list-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--brown-dark);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .schedule-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      padding: 12px;
      background: #faf8f5;
      border: 1px solid var(--border);
      border-left: 5px solid #888;
      border-radius: 8px;
    }

    .schedule-info {
      flex-grow: 1;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      margin-right: 6px;
      padding: 2px 8px;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 4px;
    }

    .schedule-time {
      color: #555;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .schedule-title {
      margin: 4px 0;
      overflow-wrap: anywhere;
      color: #2c2221;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .schedule-memo {
      margin-top: 4px;
      overflow-wrap: anywhere;
      color: #555;
      font-size: 0.82rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .action-btns {
      display: flex;
      flex-shrink: 0;
      gap: 6px;
    }

    .btn-edit,
    .btn-del {
      padding: 5px 10px;
      color: #fff;
      font-size: 0.75rem;
      border: none;
      border-radius: 4px;
    }

    .btn-edit {
      background: #557799;
    }

    .btn-del {
      background: #c33;
    }

    .empty-message {
      margin: 15px 0;
      color: #888;
      font-size: 0.85rem;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      padding: 18px;
      overflow-y: auto;
      background: rgba(35, 29, 26, 0.58);
    }

    .modal.open {
      display: block;
    }

    .modal-content {
      width: 100%;
      max-width: 720px;
      margin: 25px auto;
      overflow: hidden;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--brown) 0%, var(--brown-dark) 100%);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      padding: 0;
      color: #fff;
      font-size: 1.7rem;
      line-height: 1;
      background: rgba(255, 255, 255, 0.16);
      border: none;
      border-radius: 50%;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-footer {
      padding: 0 16px 16px;
    }

    .detail-item {
      margin-bottom: 12px;
      padding: 14px;
      background: #faf8f5;
      border: 1px solid var(--border);
      border-left: 6px solid #888;
      border-radius: 8px;
    }

    .detail-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }

    .detail-title {
      overflow-wrap: anywhere;
      font-size: 1rem;
      font-weight: 600;
    }

    .detail-date {
      margin-top: 6px;
      color: #6e625c;
      font-size: 0.78rem;
    }

    .detail-memo {
      margin-top: 9px;
      padding-top: 9px;
      overflow-wrap: anywhere;
      color: #555;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      border-top: 1px solid var(--border);
    }

    .category-form {
      padding: 14px;
      background: #faf8f5;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .category-preview {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 5px 10px;
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
    }

    .category-list {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .category-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .category-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .category-color-dot {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    .category-name {
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .helper-text {
      margin-top: 5px;
      color: #777;
      font-size: 0.75rem;
      line-height: 1.4;
    }


    .filter-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(160px, 220px) auto;
      gap: 10px;
      align-items: end;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .checkbox-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      background: #faf8f5;
      border: 1px solid #dcd5c9;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-chip input {
      width: auto;
      margin: 0;
    }

    .completion-box {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      color: #225d31;
      font-weight: 700;
      background: #eef8f0;
      border: 1px solid #b5dfbd;
      border-radius: 7px;
      cursor: pointer;
    }

    .completion-box input {
      width: auto;
      margin: 0;
    }

    .completed-item {
      opacity: 0.48;
    }

    .completed-item .schedule-title,
    .completed-item .today-title,
    .completed-item .detail-title {
      text-decoration: line-through;
    }

    .completed-mark {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 7px;
      color: #225d31;
      font-size: 0.7rem;
      font-weight: 700;
      background: #eaf7ed;
      border: 1px solid #b5dfbd;
      border-radius: 999px;
    }

    .assignee-text {
      margin-top: 6px;
      color: #655b55;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .btn-copy {
      padding: 5px 10px;
      color: #fff;
      font-size: 0.75rem;
      background: #7a5c43;
      border: none;
      border-radius: 4px;
    }

    .btn-complete {
      padding: 5px 10px;
      color: #225d31;
      font-size: 0.75rem;
      font-weight: 700;
      background: #eaf7ed;
      border: 1px solid #b5dfbd;
      border-radius: 4px;
    }

    .settings-menu {
      display: grid;
      gap: 10px;
    }

    .settings-menu button {
      width: 100%;
      text-align: left;
    }

    .future-setting {
      padding: 12px;
      color: #8a817b;
      background: #f5f3ef;
      border: 1px dashed #ccc3b8;
      border-radius: 8px;
    }

    @media (max-width: 650px) {
      .filter-grid {
        display: block;
      }

      .filter-grid > * {
        margin-bottom: 9px;
      }
    }


    .recurrence-panel { margin: 12px 0; padding: 12px; background:#f7f5f1; border:1px solid #ddd5ca; border-radius:9px; }
    .recurrence-options { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:10px; }
    .weekday-picker { display:flex; flex-wrap:wrap; gap:6px; }
    .weekday-picker label { display:inline-flex; align-items:center; gap:4px; padding:7px 9px; border:1px solid #d8d0c5; border-radius:999px; background:#fff; cursor:pointer; }
    .weekday-picker input { width:auto; margin:0; }
    .repeat-badge { display:inline-block; margin-left:6px; padding:2px 7px; border-radius:999px; background:#eee8ff; color:#56428d; font-size:.7rem; font-weight:700; }

    @media (min-width: 768px) {
      .day-cell {
        min-height: 108px;
      }

      .event-bar,
      .event-bar-wrapper {
        height: 23px;
      }

      .event-bar {
        padding: 0 6px;
        font-size: 0.75rem;
        line-height: 23px;
      }

      .day-number {
        padding: 4px 6px;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 8px;
      }

      .card {
        padding: 11px;
      }

      .form-row,
      .top-toolbar {
        display: block;
      }

      .form-row > div,
      .toolbar-buttons {
        margin-bottom: 9px;
      }

      .toolbar-buttons {
        margin-top: 9px;
      }

      .day-cell {
        min-height: 64px;
      }

      .event-bar {
        padding: 0 2px;
        font-size: 0.55rem;
      }

      .schedule-item {
        flex-direction: column;
      }

      .action-btns {
        align-self: flex-end;
      }

      .modal {
        padding: 8px;
      }

      .modal-content {
        margin: 8px auto;
      }

      .category-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="header-banner">
    <h1>Q.T.S-SCHEDULE</h1>
  </header>

  <div id="statusMessage" class="status-message" aria-live="polite"></div>

  <section class="card">
    <div class="filter-grid">
      <div class="search-wrap">
        <label for="searchInput">予定を検索</label>
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="searchInput"
          placeholder="タイトル・メモ・カテゴリー名・担当者で検索"
        >
      </div>

      <div>
        <label for="assigneeFilter">担当者で絞り込み</label>
        <select id="assigneeFilter">
          <option value="all">すべて</option>
          <option value="村口">村口</option>
          <option value="金子">金子</option>
          <option value="寺門">寺門</option>
          <option value="none">担当者なし</option>
        </select>
      </div>

      <label class="completion-box">
        <input type="checkbox" id="showCompleted" checked>
        完了済みも表示
      </label>
    </div>

    <div class="toolbar-buttons" style="margin-top:10px;">
      <button type="button" class="btn-secondary" id="btnClearSearch">
        絞り込み解除
      </button>
      <button type="button" class="btn-primary" id="btnOpenSettings">
        ⚙ 設定
      </button>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title" id="todayTitle">今日の予定</h2>
    <div id="todayScheduleList" class="today-list"></div>
  </section>

  <section class="card">
    <input type="hidden" id="editId">
    <input type="hidden" id="editOccurrenceDate">
    <input type="hidden" id="editScope" value="series">

    <div class="form-row">
      <div class="form-group">
        <label for="startDate">開始日</label>
        <input type="date" id="startDate">
      </div>

      <div class="form-group">
        <label for="endDate">終了日</label>
        <input type="date" id="endDate">
      </div>
    </div>

    <label class="all-day-box">
      <input type="checkbox" id="isAllDay">
      終日
    </label>

    <div class="form-row">
      <div class="form-group">
        <label for="startTime">開始時間</label>
        <input type="time" id="startTime">
      </div>

      <div class="form-group">
        <label for="endTime">終了時間</label>
        <input type="time" id="endTime">
      </div>
    </div>

    <div class="form-group">
      <label for="category">カテゴリー</label>
      <select id="category"></select>
      <div class="helper-text">
        カテゴリーの追加・名称・色・アイコンは「カテゴリー管理」から変更できます。
      </div>
    </div>

    <div class="form-group">
      <label>担当者（複数選択可）</label>
      <div class="checkbox-group" id="assigneeCheckboxes">
        <label class="checkbox-chip"><input type="checkbox" name="assignee" value="村口"> 村口</label>
        <label class="checkbox-chip"><input type="checkbox" name="assignee" value="金子"> 金子</label>
        <label class="checkbox-chip"><input type="checkbox" name="assignee" value="寺門"> 寺門</label>
      </div>
      <div class="helper-text">誰も選択しない場合は「担当者なし」で登録されます。</div>
    </div>

    <div class="form-group">
      <label class="completion-box">
        <input type="checkbox" id="isCompleted">
        この予定を完了済みにする
      </label>
    </div>

    <div class="recurrence-panel">
      <div class="form-group" style="margin-bottom:0;">
        <label for="recurrenceType">繰り返し</label>
        <select id="recurrenceType">
          <option value="none">繰り返しなし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
          <option value="yearly">毎年</option>
        </select>
      </div>
      <div id="recurrenceOptions" class="recurrence-options" hidden>
        <div id="weeklyOptions" hidden>
          <label>曜日（複数選択可）</label>
          <div class="weekday-picker">
            <label><input type="checkbox" name="repeatWeekday" value="0">日</label>
            <label><input type="checkbox" name="repeatWeekday" value="1">月</label>
            <label><input type="checkbox" name="repeatWeekday" value="2">火</label>
            <label><input type="checkbox" name="repeatWeekday" value="3">水</label>
            <label><input type="checkbox" name="repeatWeekday" value="4">木</label>
            <label><input type="checkbox" name="repeatWeekday" value="5">金</label>

        </div>
        <div>
          <label for="recurrenceUntil">繰り返し終了日</label>
          <input type="date" id="recurrenceUntil">

    <div class="form-group">
      <label for="title">タイトル</label>
      <input
        type="text"
        id="title"
        maxlength="100"
        placeholder="例：〇〇邸 搬入作業"
      >

    <div class="form-group">
      <label for="memo">メモ</label>
      <textarea
        id="memo"
        rows="3"
        maxlength="1000"
        placeholder="場所や持ち物など"
      ></textarea>

    <div class="btn-box">
      <button type="button" class="btn-primary" id="btnSubmit">
        予定を追加する
      </button>
      <button type="button" class="btn-secondary" id="btnCancel" hidden>
        キャンセル

  <section class="card">
    <div class="calendar-header">
      <button type="button" class="btn-secondary btn-small" id="btnPrevMonth">
        ◀ 前月
      </button>
      <h2 id="calendarMonthYear"></h2>
      <button type="button" class="btn-secondary btn-small" id="btnNextMonth">
        次月 ▶
      </button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </section>

  <section class="card">
    <div class="list-title">
      <span id="selectedDateDisplay">予定一覧</span>
      <button type="button" class="btn-secondary btn-small" id="btnShowAll">
        全表示
      </button>
    </div>
    <div id="scheduleList"></div>
  </section>

  <!-- 選択日の詳細 -->
  <div id="detailModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detailDateTitle">スケジュール詳細</h2>
        <button type="button" class="modal-close" data-close-modal="detailModal">×</button>
      </div>
      <div class="modal-body">
        <div id="detailScheduleList"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" data-close-modal="detailModal">
          閉じる
        </button>
      </div>
    </div>
  </div>


  <!-- 設定 -->
  <div id="settingsModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙ 設定</h2>
        <button type="button" class="modal-close" data-close-modal="settingsModal">×</button>
      </div>
      <div class="modal-body">
        <div class="settings-menu">
          <button type="button" class="btn-primary" id="btnOpenCategoryManager">
            🎨 カテゴリー管理
          </button>
          <div class="future-setting">バックアップ・復元（今後追加予定）</div>
          <div class="future-setting">CSV出力（今後追加予定）</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" data-close-modal="settingsModal">閉じる</button>
      </div>
    </div>
  </div>

  <!-- カテゴリー管理 -->
  <div id="categoryModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>カテゴリー管理</h2>
        <button type="button" class="modal-close" data-close-modal="categoryModal">×</button>
      </div>

      <div class="modal-body">
        <div class="category-form">
          <input type="hidden" id="categoryEditId">

          <div class="form-row">
            <div class="form-group">
              <label for="categoryNameInput">表示名</label>
              <input
                type="text"
                id="categoryNameInput"
                maxlength="30"
                placeholder="例：現地調査"
              >
            </div>

            <div class="form-group">
              <label for="categoryIconInput">アイコン</label>
              <input
                type="text"
                id="categoryIconInput"
                maxlength="4"
                placeholder="例：🔍"
              >
            </div>

            <div class="form-group">
              <label for="categoryColorInput">バーの色</label>
              <input type="color" id="categoryColorInput" value="#008b8b">
            </div>
          </div>

          <div class="form-group">
            <label>プレビュー</label>
            <div id="categoryPreview" class="category-preview">
              🔍 現地調査
            </div>
          </div>

          <div class="inline-buttons">
            <button type="button" class="btn-primary" id="btnSaveCategory">
              カテゴリーを追加
            </button>
            <button type="button" class="btn-secondary" id="btnResetCategoryForm" hidden>
              編集をキャンセル
            </button>
          </div>
        </div>

        <div class="helper-text">
          カテゴリーを削除しても、過去に登録した予定には登録時の名称・色・アイコンが残ります。
        </div>

        <div id="categoryList" class="category-list"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-primary" data-close-modal="categoryModal">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCL6VijHRZryh7DdxNVcBdDXhRJtx2JU-4",
      authDomain: "qts-schedule.firebaseapp.com",
      projectId: "qts-schedule",
      storageBucket: "qts-schedule.firebasestorage.app",
      messagingSenderId: "641800381769",
      appId: "1:641800381769:web:0fa2527128e11b605b6698"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const defaultCategories = [
      { legacyKey: "shinkansen", name: "新幹線", icon: "🚄", color: "#0055ff", order: 10 },
      { legacyKey: "airplane", name: "飛行機", icon: "✈️", color: "#00aaff", order: 20 },
      { legacyKey: "hiace", name: "ハイエース", icon: "🚐", color: "#d97706", order: 30 },
      { legacyKey: "shipping", name: "出荷", icon: "📦", color: "#8a4baf", order: 40 },
      { legacyKey: "receiving", name: "入荷", icon: "📥", color: "#2b6cb0", order: 50 },
      { legacyKey: "delivery", name: "現場搬入", icon: "🚚", color: "#2f855a", order: 60 },
      { legacyKey: "office", name: "事務所", icon: "🏢", color: "#333333", order: 70 },
      { legacyKey: "holiday", name: "休み", icon: "🏠", color: "#ff2200", order: 80 },
      { legacyKey: "meeting", name: "会議", icon: "📋", color: "#ff8800", order: 90 },
      { legacyKey: "trip", name: "出張", icon: "🧳", color: "#00aa44", order: 100 },
      { legacyKey: "outing", name: "外出", icon: "🚗", color: "#008b8b", order: 110 },
      { legacyKey: "private", name: "プライベート", icon: "👤", color: "#aa00cc", order: 120 },
      { legacyKey: "other", name: "その他", icon: "📌", color: "#885522", order: 130 }
    ];

    let schedules = [];
    let categories = [];
    let currentDisplayDate = new Date();
    let selectedDateStr = getLocalDateString(new Date());
    const fixedAssignees = ["村口", "金子", "寺門"];
    let detailSelectedDate = null;
    let searchKeyword = "";
    let assigneeFilter = "all";
    let showCompleted = true;
    let categoriesInitialized = false;

    document.addEventListener("DOMContentLoaded", initializeApp);

    function initializeApp() {
      document.getElementById("startDate").value = selectedDateStr;
      document.getElementById("endDate").value = selectedDateStr;
      document.getElementById("todayTitle").textContent =
        `今日の予定：${formatJapaneseDate(getLocalDateString(new Date()))}`;

      document.getElementById("startDate").addEventListener("change", () => { syncEndDate(); toggleRecurrenceOptions(); });
      document.getElementById("isAllDay").addEventListener("change", toggleAllDay);
      document.getElementById("recurrenceType").addEventListener("change", toggleRecurrenceOptions);
      document.getElementById("btnSubmit").addEventListener("click", addOrUpdateSchedule);
      document.getElementById("btnCancel").addEventListener("click", resetScheduleForm);
      document.getElementById("btnPrevMonth").addEventListener("click", () => changeMonth(-1));
      document.getElementById("btnNextMonth").addEventListener("click", () => changeMonth(1));
      document.getElementById("btnShowAll").addEventListener("click", showAllSchedules);

      document.getElementById("searchInput").addEventListener("input", event => {
        searchKeyword = normalizeText(event.target.value);
        renderAll();
      });

      document.getElementById("assigneeFilter").addEventListener("change", event => {
        assigneeFilter = event.target.value;
        renderAll();
      });

      document.getElementById("showCompleted").addEventListener("change", event => {
        showCompleted = event.target.checked;
        renderAll();
      });

      document.getElementById("btnClearSearch").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        document.getElementById("assigneeFilter").value = "all";
        document.getElementById("showCompleted").checked = true;
        searchKeyword = "";
        assigneeFilter = "all";
        showCompleted = true;
        renderAll();
      });

      document.getElementById("btnOpenSettings").addEventListener("click", () => {
        openModal("settingsModal");
      });

      document.getElementById("btnOpenCategoryManager").addEventListener("click", () => {
        closeModal("settingsModal");
        resetCategoryForm();
        openModal("categoryModal");
      });

      document.getElementById("categoryNameInput").addEventListener("input", updateCategoryPreview);
      document.getElementById("categoryIconInput").addEventListener("input", updateCategoryPreview);
      document.getElementById("categoryColorInput").addEventListener("input", updateCategoryPreview);
      document.getElementById("btnSaveCategory").addEventListener("click", saveCategory);
      document.getElementById("btnResetCategoryForm").addEventListener("click", resetCategoryForm);

      document.querySelectorAll("[data-close-modal]").forEach(button => {
        button.addEventListener("click", () => closeModal(button.dataset.closeModal));
      });

      document.querySelectorAll(".modal").forEach(modal => {
        modal.addEventListener("click", event => {
          if (event.target === modal) {
            closeModal(modal.id);
          }
        });
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeModal("detailModal");
          closeModal("categoryModal");
          closeModal("settingsModal");
        }
      });

      toggleAllDay();
      updateCategoryPreview();
      subscribeCategories();
      subscribeSchedules();
    }

    function subscribeCategories() {
      db.collection("categories").onSnapshot(
        async snapshot => {
          categories = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          categories.sort((a, b) =>
            Number(a.order || 9999) - Number(b.order || 9999) ||
            String(a.name || "").localeCompare(String(b.name || ""), "ja")
          );

          if (categories.length === 0 && !categoriesInitialized) {
            categoriesInitialized = true;
            await createDefaultCategories();
            return;
          }

          categoriesInitialized = true;
          renderCategoryOptions();
          renderCategoryManagerList();
          renderAll();
        },
        error => {
          console.error(error);
          showStatusMessage("カテゴリーの読み込みに失敗しました。", "error");
        }
      );
    }

    async function createDefaultCategories() {
      try {
        const batch = db.batch();

        defaultCategories.forEach(category => {
          const reference = db.collection("categories").doc();
          batch.set(reference, {
            name: category.name,
            icon: category.icon,
            color: category.color,
            legacyKey: category.legacyKey,
            order: category.order,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });

        await batch.commit();
      } catch (error) {
        console.error(error);
        showStatusMessage("初期カテゴリーを作成できませんでした。", "error");
      }
    }

    function subscribeSchedules() {
      db.collection("schedules").onSnapshot(
        snapshot => {
          schedules = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          schedules.sort(compareSchedules);
          renderAll();
          clearStatusMessage();
        },
        error => {
          console.error(error);
          showStatusMessage("予定の読み込みに失敗しました。", "error");
        }
      );
    }

    function renderAll() {
      renderTodaySchedules();
      renderCalendar();
      loadSchedules(selectedDateStr);

      if (detailSelectedDate) {
        renderDetailSchedules(detailSelectedDate);
      }
    }

    function renderCategoryOptions() {
      const select = document.getElementById("category");
      const previousValue = select.value;
      select.innerHTML = "";

      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category.id;
        option.textContent = `${category.icon || "📌"} ${category.name || "名称未設定"}`;
        select.appendChild(option);
      });

      if (categories.some(category => category.id === previousValue)) {
        select.value = previousValue;
      } else {
        const remembered = localStorage.getItem("qtsLastCategoryId");
        if (remembered && categories.some(category => category.id === remembered)) {
          select.value = remembered;
        }
      }
    }

    function renderCategoryManagerList() {
      const list = document.getElementById("categoryList");
      list.innerHTML = "";

      if (categories.length === 0) {
        list.innerHTML = '<p class="empty-message">カテゴリーはありません。</p>';
        return;
      }

      categories.forEach(category => {
        const item = document.createElement("div");
        item.className = "category-item";

        const label = document.createElement("div");
        label.className = "category-label";

        const dot = document.createElement("span");
        dot.className = "category-color-dot";
        dot.style.backgroundColor = sanitizeColor(category.color);

        const name = document.createElement("span");
        name.className = "category-name";
        name.textContent = `${category.icon || "📌"} ${category.name || "名称未設定"}`;

        label.append(dot, name);

        const buttons = document.createElement("div");
        buttons.className = "inline-buttons";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "btn-edit";
        editButton.textContent = "編集";
        editButton.addEventListener("click", () => editCategory(category.id));

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "btn-del";
        deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", () => deleteCategory(category.id));

        buttons.append(editButton, deleteButton);
        item.append(label, buttons);
        list.appendChild(item);
      });
    }

    function updateCategoryPreview() {
      const name = document.getElementById("categoryNameInput").value.trim() || "カテゴリー名";
      const icon = document.getElementById("categoryIconInput").value.trim() || "📌";
      const color = sanitizeColor(document.getElementById("categoryColorInput").value);
      const preview = document.getElementById("categoryPreview");

      preview.textContent = `${icon} ${name}`;
      preview.style.backgroundColor = color;
      preview.style.color = getContrastTextColor(color);
    }

    async function saveCategory() {
      const editId = document.getElementById("categoryEditId").value;
      const name = document.getElementById("categoryNameInput").value.trim();
      const icon = document.getElementById("categoryIconInput").value.trim() || "📌";
      const color = sanitizeColor(document.getElementById("categoryColorInput").value);

      if (!name) {
        alert("カテゴリー名を入力してください。");
        return;
      }

      const duplicate = categories.find(category =>
        normalizeText(category.name) === normalizeText(name) &&
        category.id !== editId
      );

      if (duplicate) {
        alert("同じ名前のカテゴリーが既にあります。");
        return;
      }

      try {
        const data = {
          name,
          icon,
          color,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editId) {
          await db.collection("categories").doc(editId).update(data);
          showStatusMessage("カテゴリーを更新しました。", "success");
        } else {
          await db.collection("categories").add({
            ...data,
            order: Date.now(),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          showStatusMessage("カテゴリーを追加しました。", "success");
        }

        resetCategoryForm();
      } catch (error) {
        console.error(error);
        showStatusMessage("カテゴリーを保存できませんでした。", "error");
      }
    }

    function editCategory(id) {
      const category = categories.find(item => item.id === id);
      if (!category) return;

      document.getElementById("categoryEditId").value = category.id;
      document.getElementById("categoryNameInput").value = category.name || "";
      document.getElementById("categoryIconInput").value = category.icon || "";
      document.getElementById("categoryColorInput").value = sanitizeColor(category.color);
      document.getElementById("btnSaveCategory").textContent = "カテゴリーを更新";
      document.getElementById("btnResetCategoryForm").hidden = false;
      updateCategoryPreview();
    }

    async function deleteCategory(id) {
      const category = categories.find(item => item.id === id);
      if (!category) return;

      const usedCount = schedules.filter(schedule =>
        schedule.categoryId === id ||
        (!schedule.categoryId && category.legacyKey && schedule.category === category.legacyKey)
      ).length;

      const message = usedCount > 0
        ? `「${category.name}」は${usedCount}件の予定で使用されています。\n削除後も過去の予定には登録時の名称と色が残ります。\n削除しますか？`
        : `「${category.name}」を削除しますか？`;

      if (!confirm(message)) return;

      try {
        await db.collection("categories").doc(id).delete();
        resetCategoryForm();
        showStatusMessage("カテゴリーを削除しました。", "success");
      } catch (error) {
        console.error(error);
        showStatusMessage("カテゴリーを削除できませんでした。", "error");
      }
    }

    function resetCategoryForm() {
      document.getElementById("categoryEditId").value = "";
      document.getElementById("categoryNameInput").value = "";
      document.getElementById("categoryIconInput").value = "📌";
      document.getElementById("categoryColorInput").value = "#008b8b";
      document.getElementById("btnSaveCategory").textContent = "カテゴリーを追加";
      document.getElementById("btnResetCategoryForm").hidden = true;
      updateCategoryPreview();
    }

    async function addOrUpdateSchedule() {
      const editId = document.getElementById("editId").value;
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value || startDate;
      const isAllDay = document.getElementById("isAllDay").checked;
      const startTime = isAllDay ? "" : document.getElementById("startTime").value;
      const endTime = isAllDay ? "" : document.getElementById("endTime").value;
      const title = document.getElementById("title").value.trim();
      const memo = document.getElementById("memo").value.trim();
      const categoryId = document.getElementById("category").value;
      const selectedCategory = categories.find(category => category.id === categoryId);
      const assignees = getSelectedAssignees();
      const isCompleted = document.getElementById("isCompleted").checked;
      const recurrenceType = document.getElementById("recurrenceType").value;
      const recurrenceUntil = document.getElementById("recurrenceUntil").value || null;
      const recurrenceWeekdays = Array.from(document.querySelectorAll('input[name="repeatWeekday"]:checked')).map(input => Number(input.value));

      if (!startDate || !title) {
        alert("開始日とタイトルを入力してください。");
        return;
      }

      if (!selectedCategory) {
        alert("カテゴリーを選択してください。");
        return;
      }

      if (endDate < startDate) {
        alert("終了日は開始日以降にしてください。");
        return;
      }

      if (startDate === endDate && startTime && endTime && endTime < startTime) {
        alert("終了時間は開始時間以降にしてください。");
        return;
      }

      if (recurrenceUntil && recurrenceUntil < startDate) {
        alert("繰り返し終了日は開始日以降にしてください。");
        return;
      }

      if (recurrenceType === "weekly" && recurrenceWeekdays.length === 0) {
        alert("毎週の繰り返しでは曜日を1つ以上選択してください。");
        return;
      }

      const data = {
        startDate,
        endDate,
        isAllDay,
        startTime,
        endTime,
        title,
        memo,
        assignees,
        isCompleted,
        recurrenceType,
        recurrenceUntil,
        recurrenceWeekdays: recurrenceType === "weekly" ? recurrenceWeekdays : [],
        recurrenceExceptions: {},
        excludedDates: [],
        completedAt: isCompleted
          ? firebase.firestore.FieldValue.serverTimestamp()
          : null,
        categoryId: selectedCategory.id,
        categoryName: selectedCategory.name,
        categoryColor: sanitizeColor(selectedCategory.color),
        categoryIcon: selectedCategory.icon || "📌",
        category: selectedCategory.legacyKey || null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      const submitButton = document.getElementById("btnSubmit");

      try {
        submitButton.disabled = true;

        if (editId) {
          const original = schedules.find(schedule => schedule.id === editId);
          const occurrenceDate = document.getElementById("editOccurrenceDate").value;
          const scope = document.getElementById("editScope").value;

          if (original && isRecurringSchedule(original) && occurrenceDate && scope === "single") {
            const exceptions = { ...(original.recurrenceExceptions || {}) };
            exceptions[occurrenceDate] = { ...data, startDate, endDate };
            await db.collection("schedules").doc(editId).update({
              recurrenceExceptions: exceptions,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showStatusMessage("この予定だけ更新しました。", "success");
          } else if (original && isRecurringSchedule(original) && occurrenceDate && scope === "future" && occurrenceDate !== original.startDate) {
            const previousDay = addDaysString(occurrenceDate, -1);
            await db.collection("schedules").doc(editId).update({
              recurrenceUntil: previousDay,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            await db.collection("schedules").add({
              ...data,
              startDate,
              endDate,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showStatusMessage("この予定以降を更新しました。", "success");
          } else {
            const preserve = original ? {
              recurrenceExceptions: original.recurrenceExceptions || {},
              excludedDates: original.excludedDates || []
            } : {};
            await db.collection("schedules").doc(editId).update({ ...data, ...preserve });
            showStatusMessage("予定を更新しました。", "success");
          }
        } else {
          await db.collection("schedules").add({
            ...data,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          showStatusMessage("予定を追加しました。", "success");
        }

        localStorage.setItem("qtsLastCategoryId", selectedCategory.id);
        selectedDateStr = startDate;
        const date = createDateFromString(startDate);

        if (date) {
          currentDisplayDate = new Date(date.getFullYear(), date.getMonth(), 1);
        }

        resetScheduleForm();
      } catch (error) {
        console.error(error);
        showStatusMessage("予定を保存できませんでした。", "error");
      } finally {
        submitButton.disabled = false;
      }
    }

    function editSchedule(itemOrId) {
      const item = typeof itemOrId === "string" ? schedules.find(s => s.id === itemOrId) : itemOrId;
      if (!item) return;
      const original = schedules.find(s => s.id === (item._seriesId || item.id)) || item;
      let scope = "series";
      if (isRecurringSchedule(original) && item._occurrenceDate) {
        const answer = prompt("繰り返し予定の編集範囲を選んでください。\\n1：この予定だけ\\n2：この予定以降\\n3：シリーズ全体", "1");
        if (answer === null) return;
        scope = answer === "2" ? "future" : answer === "3" ? "series" : "single";
      }
      closeModal("detailModal");
      document.getElementById("editId").value = original.id;
      document.getElementById("editOccurrenceDate").value = item._occurrenceDate || item.startDate || "";
      document.getElementById("editScope").value = scope;
      document.getElementById("startDate").value = item.startDate || "";
      document.getElementById("endDate").value = item.endDate || item.startDate || "";
      document.getElementById("isAllDay").checked = Boolean(item.isAllDay);
      toggleAllDay();
      document.getElementById("startTime").value = item.startTime || "";

    async function toggleScheduleCompleted(itemOrId) {
      const item = typeof itemOrId === "string" ? schedules.find(s => s.id === itemOrId) : itemOrId;
      if (!item) return;
      const original = schedules.find(s => s.id === (item._seriesId || item.id)) || item;
      const next = !Boolean(item.isCompleted);
      try {
        if (isRecurringSchedule(original) && item._occurrenceDate) {
          const exceptions = { ...(original.recurrenceExceptions || {}) };
          exceptions[item._occurrenceDate] = { ...(exceptions[item._occurrenceDate] || {}), isCompleted: next };
          await db.collection("schedules").doc(original.id).update({ recurrenceExceptions: exceptions, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await db.collection("schedules").doc(original.id).update({ isCompleted: next, completedAt: next ? firebase.firestore.FieldValue.serverTimestamp() : null, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        }
        showStatusMessage(next ? "予定を完了にしました。" : "予定を未完了に戻しました。", "success");
      } catch (error) { console.error(error); showStatusMessage("完了状態を変更できませんでした。", "error"); }
    }

    async function deleteSchedule(itemOrId) {
      const item = typeof itemOrId === "string" ? schedules.find(s => s.id === itemOrId) : itemOrId;
      if (!item) return;
      const original = schedules.find(s => s.id === (item._seriesId || item.id)) || item;
      let scope = "series";
      if (isRecurringSchedule(original) && item._occurrenceDate) {
        const answer = prompt("繰り返し予定の削除範囲を選んでください。\\n1：この予定だけ\\n2：この予定以降\\n3：シリーズ全体", "1");
        if (answer === null) return;
        scope = answer === "2" ? "future" : answer === "3" ? "series" : "single";
      }
      if (!confirm(`「${item.title || "この予定"}」を削除しますか？`)) return;
      try {
        if (scope === "single") {
          const excluded = Array.from(new Set([...(original.excludedDates || []), item._occurrenceDate]));
          await db.collection("schedules").doc(original.id).update({ excludedDates: excluded, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else if (scope === "future" && item._occurrenceDate !== original.startDate) {
          await db.collection("schedules").doc(original.id).update({ recurrenceUntil: addDaysString(item._occurrenceDate, -1), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await db.collection("schedules").doc(original.id).delete();
        }
        showStatusMessage("予定を削除しました。", "success");
      } catch (error) { console.error(error); showStatusMessage("予定を削除できませんでした。", "error"); }
    }

    function renderCalendar() {
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      const year = currentDisplayDate.getFullYear();
      const month = currentDisplayDate.getMonth();
      document.getElementById("calendarMonthYear").textContent = `${year}年 ${month + 1}月`;

      ["日", "月", "火", "水", "木", "金", "土"].forEach((day, index) => {
        const header = document.createElement("div");
        header.className = "day-header";
        if (index === 0) header.classList.add("sunday");
        if (index === 6) header.classList.add("saturday");
        header.textContent = day;
        grid.appendChild(header);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty";
        grid.appendChild(empty);
      }

      const today = getLocalDateString(new Date());
      const monthStart = createCalendarDateString(year, month, 1);
      const monthEnd = createCalendarDateString(year, month, lastDate);

      const activeSchedules = getOccurrencesForRange(monthStart, monthEnd)
        .filter(matchesCurrentFilters);

      const daySlots = {};
      for (let day = 1; day <= lastDate; day++) {
        daySlots[createCalendarDateString(year, month, day)] = [];
      }

      const scheduleSlots = {};

      activeSchedules.forEach(schedule => {
        let slot = 0;

        while (true) {
          let available = true;

          for (let day = 1; day <= lastDate; day++) {
            const dateStr = createCalendarDateString(year, month, day);
            if (scheduleOccursOn(schedule, dateStr) && daySlots[dateStr][slot]) {
              available = false;
              slot++;
              break;
            }
          }

          if (available) break;
        }

        scheduleSlots[schedule.id] = slot;

        for (let day = 1; day <= lastDate; day++) {
          const dateStr = createCalendarDateString(year, month, day);
          if (scheduleOccursOn(schedule, dateStr)) {
            daySlots[dateStr][slot] = schedule.id;
          }
        }
      });

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = createCalendarDateString(year, month, day);
        const dayOfWeek = new Date(year, month, day).getDay();
        const cell = document.createElement("div");
        cell.className = "day-cell";

        if (dateStr === today) cell.classList.add("today");
        if (dateStr === selectedDateStr) cell.classList.add("selected");

        const number = document.createElement("div");
        number.className = "day-number";
        if (dayOfWeek === 0) number.classList.add("sunday");
        if (dayOfWeek === 6) number.classList.add("saturday");
        number.textContent = day;
        cell.appendChild(number);

        const events = document.createElement("div");
        events.className = "events-container";

        const dayEvents = activeSchedules.filter(schedule => scheduleOccursOn(schedule, dateStr));
        const maxSlot = Math.max(-1, ...dayEvents.map(schedule => scheduleSlots[schedule.id]));

        for (let slot = 0; slot <= maxSlot; slot++) {
          const wrapper = document.createElement("div");
          wrapper.className = "event-bar-wrapper";

          const target = dayEvents.find(schedule => scheduleSlots[schedule.id] === slot);

          if (target) {
            const isSegmentStart =
              dateStr === target.startDate ||
              dayOfWeek === 0 ||
              day === 1;

            if (isSegmentStart) {
              const end = target.endDate || target.startDate;
              const bar = document.createElement("div");
              const category = getCategoryForSchedule(target);
              let spanDays = 0;
              const cursor = new Date(year, month, day);

              while (true) {
                const current = getLocalDateString(cursor);
                if (current > end) break;

                spanDays++;

                if (
                  cursor.getDay() === 6 ||
                  cursor.getMonth() !== month ||
                  cursor.getDate() === lastDate
                ) break;

                cursor.setDate(cursor.getDate() + 1);
              }

              bar.className = "event-bar";
              if (target.isCompleted) bar.style.opacity = "0.45";
              bar.style.backgroundColor = category.color;
              bar.style.color = getContrastTextColor(category.color);
              bar.style.width = `calc(${spanDays * 100}% + ${(spanDays - 1) * 2}px)`;
              bar.textContent = createEventBarText(target, category);
              bar.title = `${category.icon} ${category.name} / ${getScheduleTimeText(target)} / ${target.title || "無題"}`;
              wrapper.appendChild(bar);
            }
          }

          events.appendChild(wrapper);
        }

        cell.appendChild(events);
        cell.addEventListener("click", () => selectCalendarDate(dateStr));
        grid.appendChild(cell);
      }
    }

    function getCategoryForSchedule(schedule) {
      if (schedule.categoryId) {
        const current = categories.find(category => category.id === schedule.categoryId);
        if (current) {
          return {
            id: current.id,
            name: current.name || "その他",
            icon: current.icon || "📌",
            color: sanitizeColor(current.color),
            legacyKey: current.legacyKey || null
          };
        }
      }

      if (schedule.category) {
        const legacyCurrent = categories.find(category => category.legacyKey === schedule.category);
        if (legacyCurrent) {
          return {
            id: legacyCurrent.id,
            name: legacyCurrent.name || "その他",
            icon: legacyCurrent.icon || "📌",
            color: sanitizeColor(legacyCurrent.color),
            legacyKey: legacyCurrent.legacyKey || null
          };
        }

        const fallback = defaultCategories.find(category => category.legacyKey === schedule.category);
        if (fallback) {
          return {
            id: null,
            name: fallback.name,
            icon: fallback.icon,
            color: fallback.color,
            legacyKey: fallback.legacyKey
          };
        }
      }

      return {
        id: null,
        name: schedule.categoryName || "その他",
        icon: schedule.categoryIcon || "📌",
        color: sanitizeColor(schedule.categoryColor || "#885522"),
        legacyKey: null
      };
    }


    function getSelectedAssignees() {
      return Array.from(document.querySelectorAll('input[name="assignee"]:checked'))
        .map(input => input.value)
        .filter(name => fixedAssignees.includes(name));
    }

    function setSelectedAssignees(names) {
      const selected = Array.isArray(names) ? names : [];
      document.querySelectorAll('input[name="assignee"]').forEach(input => {
        input.checked = selected.includes(input.value);
      });
    }

    function getScheduleAssignees(schedule) {
      if (Array.isArray(schedule.assignees)) {
        return schedule.assignees.filter(name => fixedAssignees.includes(name));
      }

      if (typeof schedule.assignee === "string" && fixedAssignees.includes(schedule.assignee)) {
        return [schedule.assignee];
      }

      return [];
    }

    function getAssigneeText(schedule) {
      const names = getScheduleAssignees(schedule);
      return names.length ? names.join("・") : "なし";
    }

    function matchesCurrentFilters(schedule) {
      if (!matchesSearch(schedule)) return false;
      if (!showCompleted && schedule.isCompleted) return false;

      const names = getScheduleAssignees(schedule);
      if (assigneeFilter === "none") return names.length === 0;
      if (assigneeFilter !== "all" && !names.includes(assigneeFilter)) return false;

      return true;
    }

    function matchesSearch(schedule) {
      if (!searchKeyword) return true;

      const category = getCategoryForSchedule(schedule);
      const haystack = normalizeText([
        schedule.title,
        schedule.memo,
        category.name,
        category.icon,
        schedule.startDate,
        schedule.endDate,
        schedule.startTime,
        schedule.endTime,
        getAssigneeText(schedule),
        schedule.isCompleted ? "完了" : "未完了",
        getRecurrenceLabel(schedule)
      ].filter(Boolean).join(" "));

      return haystack.includes(searchKeyword);
    }

    function createEventBarText(schedule, category) {
      const prefix = schedule.isAllDay || !schedule.startTime
        ? `${category.icon}`
        : `${category.icon} ${schedule.startTime}`;
      return `${prefix} ${schedule.title || "無題"}`;
    }


    function isRecurringSchedule(schedule) {
      return Boolean(schedule && schedule.recurrenceType && schedule.recurrenceType !== "none");
    }

    function toggleRecurrenceOptions() {
      const type = document.getElementById("recurrenceType").value;
      document.getElementById("recurrenceOptions").hidden = type === "none";
      document.getElementById("weeklyOptions").hidden = type !== "weekly";
      if (type === "weekly" && !document.querySelector('input[name="repeatWeekday"]:checked')) {
        const start = createDateFromString(document.getElementById("startDate").value);
        if (start) { const input = document.querySelector(`input[name="repeatWeekday"][value="${start.getDay()}"]`); if (input) input.checked = true; }
      }
    }

    function setWeekdays(days) {
      const values = Array.isArray(days) ? days.map(Number) : [];
      document.querySelectorAll('input[name="repeatWeekday"]').forEach(input => input.checked = values.includes(Number(input.value)));
    }

    function getRecurrenceLabel(schedule) {
      const type = schedule.recurrenceType || (schedule._isRecurring ? schedule._recurrenceType : "none");
      if (type === "daily") return "毎日";
      if (type === "weekly") return "毎週";
      if (type === "monthly") return "毎月";
      if (type === "yearly") return "毎年";
      return "繰り返し";
    }

    function addDaysString(dateStr, days) {
      const date = createDateFromString(dateStr); if (!date) return dateStr;
      date.setDate(date.getDate() + days); return getLocalDateString(date);
    }

    function daysBetween(start, end) {
      const a=createDateFromString(start), b=createDateFromString(end); if(!a||!b) return 0;
      return Math.round((b-a)/86400000);
    }

    function occurrenceMatches(schedule, date) {
      const start=createDateFromString(schedule.startDate); if(!start || date<start) return false;
      const type=schedule.recurrenceType;
      if(type==="daily") return true;
      if(type==="weekly") return (schedule.recurrenceWeekdays||[start.getDay()]).map(Number).includes(date.getDay());
      if(type==="monthly") return date.getDate()===start.getDate();
      if(type==="yearly") return date.getMonth()===start.getMonth() && date.getDate()===start.getDate();
      return false;
    }

    function getOccurrencesForRange(rangeStart, rangeEnd) {
      const result=[];
      schedules.forEach(schedule => {
        if(!schedule.startDate) return;
        if(!isRecurringSchedule(schedule)) {
          const end=schedule.endDate||schedule.startDate;
          if(schedule.startDate<=rangeEnd && end>=rangeStart) result.push(schedule);
          return;
        }
        const seriesEnd=schedule.recurrenceUntil && schedule.recurrenceUntil<rangeEnd ? schedule.recurrenceUntil : rangeEnd;
        let cursor=createDateFromString(rangeStart>schedule.startDate?rangeStart:schedule.startDate);
        const endDate=createDateFromString(seriesEnd); if(!cursor||!endDate||cursor>endDate) return;
        const duration=Math.max(0,daysBetween(schedule.startDate,schedule.endDate||schedule.startDate));
        const excluded=new Set(schedule.excludedDates||[]);
        const exceptions=schedule.recurrenceExceptions||{};
        let guard=0;
        while(cursor<=endDate && guard<3700) {
          const occurrenceDate=getLocalDateString(cursor);
          if(occurrenceMatches(schedule,cursor) && !excluded.has(occurrenceDate)) {
            const override=exceptions[occurrenceDate]||{};
            const occurrence={...schedule,...override,id:schedule.id,_seriesId:schedule.id,_occurrenceDate:occurrenceDate,_isRecurring:true,_recurrenceType:schedule.recurrenceType,startDate:override.startDate||occurrenceDate,endDate:override.endDate||addDaysString(occurrenceDate,duration)};
            result.push(occurrence);
          }
          cursor.setDate(cursor.getDate()+1); guard++;
        }
      });
      return result;
    }

    function scheduleOccursOn(schedule, dateStr) {
      if (!schedule.startDate) return false;
      const end = schedule.endDate || schedule.startDate;
      return dateStr >= schedule.startDate && dateStr <= end;
    }

    function compareSchedules(a, b) {
      const dateCompare = String(a.startDate || "").localeCompare(String(b.startDate || ""));
      if (dateCompare !== 0) return dateCompare;
      if (a.isAllDay && !b.isAllDay) return -1;
      if (!a.isAllDay && b.isAllDay) return 1;
      return String(a.startTime || "00:00").localeCompare(String(b.startTime || "00:00"));
    }

    function selectCalendarDate(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById("startDate").value = dateStr;
      document.getElementById("endDate").value = dateStr;
      renderCalendar();
      loadSchedules(dateStr);
      openDetailModal(dateStr);
    }

    function showAllSchedules() {
      selectedDateStr = null;
      renderCalendar();
      loadSchedules(null);
    }

    function changeMonth(delta) {
      currentDisplayDate.setDate(1);
      currentDisplayDate.setMonth(currentDisplayDate.getMonth() + delta);
      renderCalendar();
    }

    function toggleAllDay() {
      const checked = document.getElementById("isAllDay").checked;
      const start = document.getElementById("startTime");
      const end = document.getElementById("endTime");
      start.disabled = checked;
      end.disabled = checked;

      if (checked) {
        start.value = "";
        end.value = "";
      }
    }

    function syncEndDate() {
      const start = document.getElementById("startDate").value;
      const end = document.getElementById("endDate").value;
      if (!end || end < start) {
        document.getElementById("endDate").value = start;
      }
    }

    function getScheduleTimeText(schedule) {
      if (schedule.isAllDay || !schedule.startTime) return "☀️ 終日";
      return schedule.endTime
        ? `⏰ ${schedule.startTime}〜${schedule.endTime}`
        : `⏰ ${schedule.startTime}`;
    }

    function getScheduleDateRangeText(schedule) {
      const start = schedule.startDate || "";
      const end = schedule.endDate || start;
      return end !== start ? `${start} 〜 ${end}` : start;
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.add("open");
      document.body.classList.add("modal-open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.remove("open");

      if (id === "detailModal") {
        detailSelectedDate = null;
      }

      if (!document.querySelector(".modal.open")) {
        document.body.classList.remove("modal-open");
      }
    }

    function getLocalDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function createCalendarDateString(year, zeroBasedMonth, day) {
      return `${year}-${String(zeroBasedMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function createDateFromString(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function formatJapaneseDate(dateStr) {
      const date = createDateFromString(dateStr);
      if (!date) return dateStr || "";
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日（${weekdays[date.getDay()]}）`;
    }

    function normalizeText(value) {
      return String(value || "").trim().toLocaleLowerCase("ja");
    }

    function sanitizeColor(value) {
      return /^#[0-9a-fA-F]{6}$/.test(String(value || ""))
        ? value
        : "#885522";
    }

    function getContrastTextColor(hexColor) {
      const color = sanitizeColor(hexColor).slice(1);
      const red = parseInt(color.slice(0, 2), 16);
      const green = parseInt(color.slice(2, 4), 16);
      const blue = parseInt(color.slice(4, 6), 16);
      const luminance = (red * 299 + green * 587 + blue * 114) / 1000;
      return luminance >= 160 ? "#222222" : "#ffffff";
    }

    function showStatusMessage(message, type = "success") {
      const status = document.getElementById("statusMessage");
      status.className = `status-message ${type}`;
      status.textContent = message;

      window.setTimeout(() => {
        if (status.textContent === message) clearStatusMessage();
      }, 4000);
    }

    function clearStatusMessage() {
      const status = document.getElementById("statusMessage");
      status.className = "status-message";
      status.textContent = "";
    }
  </script>
</body>
</html>
